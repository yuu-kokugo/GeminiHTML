<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>円の転がり移動シミュレーター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background: #eef2f3; padding: 20px; color: #333; }
        #app { max-width: 950px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
        .header { background: #2c3e50; color: white; padding: 20px; width: 100%; border-radius: 12px; font-size: 24px; font-weight: bold; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        #menuScreen { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; }
        .shape-btn { background: white; border: 4px solid #ddd; border-radius: 15px; padding: 25px; cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: all 0.2s; width: 220px; height: 220px; position: relative; }
        .shape-btn:hover { transform: translateY(-5px); border-color: #3498db; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .shape-btn svg { width: 110px; height: 110px; margin-bottom: 15px; }
        .shape-btn .label { font-size: 18px; font-weight: bold; color: #2c3e50; }
        .shape-btn .num { position: absolute; top: 10px; left: 15px; font-size: 24px; color: #bdc3c7; font-style: italic; }

        #animationContainer { display: none; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; }
        canvas { background: #fff; border: 2px solid #2c3e50; border-radius: 8px; margin-bottom: 25px; }
        
        .controls { display: flex; justify-content: center; gap: 15px; }
        .mode-btn { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; color: white; font-weight: bold; transition: 0.2s; min-width: 200px; }
        .in-btn { background: #ff85a2; }
        .out-btn { background: #3498db; }
        .nav-btn { background: #95a5a6; }
        .mode-btn:hover { opacity: 0.9; transform: scale(1.05); }

        .desc-box { margin-top: 20px; padding: 15px; background: #f9f9f9; border-left: 5px solid #3498db; text-align: left; line-height: 1.6; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">円の転がり移動</div>

        <div id="menuScreen">
            <button class="shape-btn" onclick="initApp('tri')">
                <span class="num">1</span>
                <svg viewBox="0 0 100 100"><polygon points="50,15 15,85 85,85" fill="#fff" stroke="#333" stroke-width="3"/></svg>
                <div class="label">正三角形</div>
            </button>
            <button class="shape-btn" onclick="initApp('right')">
                <span class="num">2</span>
                <svg viewBox="0 0 100 100"><polygon points="20,15 20,85 85,85" fill="#fff" stroke="#333" stroke-width="3"/></svg>
                <div class="label">直角三角形</div>
            </button>
            <button class="shape-btn" onclick="initApp('rect')">
                <span class="num">3</span>
                <svg viewBox="0 0 100 100"><rect x="15" y="30" width="70" height="40" fill="#fff" stroke="#333" stroke-width="3"/></svg>
                <div class="label">長方形</div>
            </button>
            <button class="shape-btn" onclick="initApp('all')">
                <span class="num">4</span>
                <svg viewBox="0 0 100 100">
                    <polygon points="35,20 15,50 55,50" fill="none" stroke="#333" stroke-width="2"/>
                    <rect x="65" y="20" width="25" height="30" fill="none" stroke="#333" stroke-width="2"/>
                    <rect x="25" y="65" width="50" height="15" fill="none" stroke="#333" stroke-width="2"/>
                </svg>
                <div class="label">３つ同時に</div>
            </button>
        </div>

        <div id="animationContainer">
            <canvas id="canvas" width="850" height="500"></canvas>
            <div class="controls">
                <button id="inAction" class="mode-btn in-btn">内側を移動させる</button>
                <button id="outAction" class="mode-btn out-btn">外側を移動させる</button>
                <button class="mode-btn nav-btn" onclick="location.reload()">メニューに戻る</button>
            </div>
            <div class="desc-box" id="infoText">
                円が移動したあとの形を、長方形とおうぎ形に分けて考えてみましょう。中心が通った跡（赤の点線）の長さがわかると、計算しやすくなりますね。
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tCanvas = document.createElement('canvas'); 
    tCanvas.width = canvas.width; tCanvas.height = canvas.height;
    const tCtx = tCanvas.getContext('2d');

    let activeRadius = 17.5; 
    let isRolling = false;
    let progress = 0;
    let activeShapes = [];
    let lastPosList = [];
    let currentMode = 'out';

    function getShapeData(type, ox, oy, size, r) {
        let pts = [];
        if (type === 'tri') {
            const h = size * Math.sqrt(3) / 2;
            pts = [{x:0, y:-h*2/3}, {x:size/2, y:h/3}, {x:-size/2, y:h/3}];
        } else if (type === 'right') {
            const w = size * 0.8; const h = size * 0.6;
            pts = [{x:-w/2, y:-h/2}, {x:w/2, y:h/2}, {x:-w/2, y:h/2}];
        } else if (type === 'rect') {
            const w = size * 0.8; const h = size * 0.5;
            pts = [{x:-w/2, y:-h/2}, {x:w/2, y:-h/2}, {x:w/2, y:h/2}, {x:-w/2, y:h/2}];
        }
        
        const outSegments = [];
        let totalOutDist = 0;
        for(let i=0; i<pts.length; i++) {
            const p1 = pts[i], p2 = pts[(i+1)%pts.length], p3 = pts[(i+2)%pts.length];
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.sqrt(dx*dx + dy*dy);
            outSegments.push({ type: 'line', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, len: len });
            totalOutDist += len;
            const ang = getOuterAngle(p1, p2, p3);
            const arcLen = r * ang;
            outSegments.push({ type: 'arc', cx: p2.x, cy: p2.y, ang: ang, len: arcLen, p1: p1, p2: p2 });
            totalOutDist += arcLen;
        }

        const inSegments = [];
        let totalInDist = 0;
        for(let i=0; i<pts.length; i++) {
            const p0 = pts[(i-1+pts.length)%pts.length], p1 = pts[i], p2 = pts[(i+1)%pts.length], p3 = pts[(i+2)%pts.length];
            const angStart = getInnerAngle(p0, p1, p2);
            const angEnd = getInnerAngle(p1, p2, p3);
            const dStart = r / Math.tan(angStart/2);
            const dEnd = r / Math.tan(angEnd/2);
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const fullLen = Math.sqrt(dx*dx + dy*dy);
            const actualLen = Math.max(0, fullLen - dStart - dEnd);
            inSegments.push({ type: 'line', x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, dStart, dEnd, len: actualLen, fullLen });
            totalInDist += actualLen;
        }

        return { pts, ox, oy, outSegments, inSegments, totalOutDist, totalInDist, r };
    }

    function getOuterAngle(p1, p2, p3) {
        const a1 = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
        let diff = a2 - a1;
        while (diff < 0) diff += Math.PI * 2;
        return diff;
    }

    function getInnerAngle(p1, p2, p3) {
        const a1 = Math.atan2(p1.y - p2.y, p1.x - p2.x);
        const a2 = Math.atan2(p3.y - p2.y, p3.x - p2.x);
        let diff = a2 - a1;
        while (diff < 0) diff += Math.PI * 2;
        return (diff > Math.PI) ? Math.PI * 2 - diff : diff;
    }

    function initApp(type) {
        document.getElementById('menuScreen').style.display = 'none';
        document.getElementById('animationContainer').style.display = 'block';
        
        // 3つ同時の時は半径12.5、それ以外は17.5(25の0.7倍)
        activeRadius = (type === 'all') ? 12.5 : 17.5;

        if (type === 'all') {
            activeShapes = [
                getShapeData('tri', 180, 220, 160, activeRadius), 
                getShapeData('right', 450, 220, 180, activeRadius), 
                getShapeData('rect', 720, 220, 160, activeRadius)
            ];
        } else {
            activeShapes = [getShapeData(type, 425, 250, 280, activeRadius)];
        }
        draw();
    }

    function defineShapePath(context, shape) {
        context.beginPath();
        shape.pts.forEach((p, i) => {
            const x = p.x + shape.ox, y = p.y + shape.oy;
            if(i===0) context.moveTo(x,y); else context.lineTo(x,y);
        });
        context.closePath();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 図形の塗りつぶし
        activeShapes.forEach(s => {
            defineShapePath(ctx, s);
            ctx.fillStyle = "#fff"; ctx.fill();
        });

        // 2. 軌跡エリアの描画
        ctx.drawImage(tCanvas, 0, 0);

        // 3. 補助線（点線）の描画（動きが止まった後）
        if (!isRolling && progress === 1) {
            activeShapes.forEach(s => drawDashedLines(ctx, s, currentMode));
        }

        // 4. 円の描画
        activeShapes.forEach(s => {
            if (isRolling || progress > 0) {
                const result = calculatePos(s, progress, currentMode);
                const pos = result.pos;
                const angle = result.dist / s.r;

                ctx.beginPath(); ctx.arc(pos.x, pos.y, s.r, 0, Math.PI*2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; ctx.fill();
                ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = 2; ctx.stroke();
                
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(angle);
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(s.r - (s.r/5), 0);
                ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = Math.max(1, s.r/8); ctx.stroke();
                ctx.restore();
                
                ctx.fillStyle = "#e74c3c"; ctx.beginPath(); ctx.arc(pos.x, pos.y, 3, 0, Math.PI*2); ctx.fill();
            }
        });

        // 5. 図形の枠線（最前面）
        activeShapes.forEach(s => {
            defineShapePath(ctx, s);
            ctx.strokeStyle = "#2c3e50"; ctx.lineWidth = 3; ctx.stroke();
        });
    }

    function drawDashedLines(c, s, mode) {
        // 黒の点線：面積を分ける線
        c.setLineDash([5, 5]);
        c.strokeStyle = "#333";
        c.lineWidth = 1;
        const segments = (mode === 'out') ? s.outSegments : s.inSegments;
        
        segments.forEach(seg => {
            if (mode === 'out' && seg.type === 'arc') {
                // おうぎ形の両端に境界線を引く
                const startNormal = Math.atan2(seg.p2.y - seg.p1.y, seg.p2.x - seg.p1.x) - Math.PI/2;
                const endNormal = startNormal + seg.ang;
                
                c.beginPath();
                c.moveTo(seg.cx + s.ox, seg.cy + s.oy);
                c.lineTo(seg.cx + s.ox + Math.cos(startNormal)*s.r, seg.cy + s.oy + Math.sin(startNormal)*s.r);
                c.stroke();
                
                c.beginPath();
                c.moveTo(seg.cx + s.ox, seg.cy + s.oy);
                c.lineTo(seg.cx + s.ox + Math.cos(endNormal)*s.r, seg.cy + s.oy + Math.sin(endNormal)*s.r);
                c.stroke();
            } else if (mode === 'in' && seg.type === 'line' && seg.len > 0) {
                // 内側の角の隙間の境界線
                const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
                const nx = dy/seg.fullLen, ny = -dx/seg.fullLen;
                const sX = seg.x1 + (dx/seg.fullLen)*seg.dStart + s.ox;
                const sY = seg.y1 + (dy/seg.fullLen)*seg.dStart + s.oy;
                const eX = sX + (dx/seg.fullLen)*seg.len;
                const eY = sY + (dy/seg.fullLen)*seg.len;
                
                c.beginPath(); c.moveTo(sX, sY); c.lineTo(sX - nx*s.r, sY - ny*s.r); c.stroke();
                c.beginPath(); c.moveTo(eX, eY); c.lineTo(eX - nx*s.r, eY - ny*s.r); c.stroke();
            }
        });

        // 赤の点線：中心の軌跡
        c.strokeStyle = "#e74c3c";
        c.lineWidth = 2;
        c.beginPath();
        for(let p=0; p<=1; p+=0.01) {
            const pos = calculatePos(s, p, mode).pos;
            if(p===0) c.moveTo(pos.x, pos.y); else c.lineTo(pos.x, pos.y);
        }
        c.lineTo(calculatePos(s, 1, mode).pos.x, calculatePos(s, 1, mode).pos.y);
        c.stroke();
        c.setLineDash([]); // 元に戻す
    }

    function startRoll(mode) {
        if(isRolling) return;
        currentMode = mode; progress = 0; isRolling = true;
        tCtx.clearRect(0, 0, canvas.width, canvas.height);
        lastPosList = activeShapes.map(s => calculatePos(s, 0, mode).pos);
        
        function step() {
            progress += 0.0035;
            if (progress > 1) progress = 1;

            activeShapes.forEach((s, i) => {
                const res = calculatePos(s, progress, mode);
                const pos = res.pos;
                if (mode === 'in') {
                    tCtx.beginPath();
                    tCtx.arc(pos.x, pos.y, s.r, 0, Math.PI * 2);
                    tCtx.fillStyle = "#ffc0cb";
                    tCtx.fill();
                } else {
                    tCtx.beginPath();
                    tCtx.strokeStyle = "rgba(52, 152, 219, 0.3)";
                    tCtx.lineCap = "round";
                    tCtx.lineWidth = s.r * 2; 
                    tCtx.moveTo(lastPosList[i].x, lastPosList[i].y);
                    tCtx.lineTo(pos.x, pos.y);
                    tCtx.stroke();
                }
                lastPosList[i] = pos;
            });

            draw();
            if (progress < 1) requestAnimationFrame(step);
            else {
                isRolling = false;
                draw(); // 最終フレームで点線を描画するため
            }
        }
        step();
    }

    function calculatePos(shape, p, mode) {
        const r = shape.r;
        if (mode === 'out') {
            let totalDist = p * shape.totalOutDist;
            let currentDist = 0;
            for (const seg of shape.outSegments) {
                if (totalDist <= currentDist + seg.len) {
                    const localP = (seg.len === 0) ? 0 : (totalDist - currentDist) / seg.len;
                    if (seg.type === 'line') {
                        const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
                        const nx = dy/seg.len, ny = -dx/seg.len;
                        return { pos: { x: seg.x1 + dx*localP + nx*r + shape.ox, y: seg.y1 + dy*localP + ny*r + shape.oy }, dist: totalDist };
                    } else {
                        const startNormalAng = Math.atan2(seg.p2.y - seg.p1.y, seg.p2.x - seg.p1.x) - Math.PI/2;
                        const curAng = startNormalAng + seg.ang * localP;
                        return { pos: { x: seg.cx + Math.cos(curAng)*r + shape.ox, y: seg.cy + Math.sin(curAng)*r + shape.oy }, dist: totalDist };
                    }
                }
                currentDist += seg.len;
            }
            const lastPos = calculatePos(shape, 0.999, 'out').pos; // 簡易回避
            return { pos: lastPos, dist: totalDist };
        } else {
            let totalDist = p * shape.totalInDist;
            let currentDist = 0;
            let cumulativeEdgeDist = 0;
            for (const seg of shape.inSegments) {
                if (totalDist <= currentDist + seg.len) {
                    const localP = (seg.len === 0) ? 0 : (totalDist - currentDist) / seg.len;
                    const dx = seg.x2 - seg.x1, dy = seg.y2 - seg.y1;
                    const nx = dy/seg.fullLen, ny = -dx/seg.fullLen;
                    const startX = seg.x1 + (dx/seg.fullLen)*seg.dStart;
                    const startY = seg.y1 + (dy/seg.fullLen)*seg.dStart;
                    const actualDistTraveledOnEdge = cumulativeEdgeDist + (seg.dStart + localP * seg.len);
                    return { 
                        pos: { x: startX + (dx/seg.fullLen)*seg.len*localP - nx*r + shape.ox, y: startY + (dy/seg.fullLen)*seg.len*localP - ny*r + shape.oy },
                        dist: actualDistTraveledOnEdge 
                    };
                }
                currentDist += seg.len;
                cumulativeEdgeDist += seg.fullLen;
            }
            const fSeg = shape.inSegments[0];
            const dx = fSeg.x2 - fSeg.x1, dy = fSeg.y2 - fSeg.y1;
            const nx = dy/fSeg.fullLen, ny = -dx/fSeg.fullLen;
            return { pos: { x: fSeg.x1 + (dx/fSeg.fullLen)*fSeg.dStart - nx*r + shape.ox, y: fSeg.y1 + (dy/fSeg.fullLen)*fSeg.dStart - ny*r + shape.oy }, dist: 0 };
        }
    }

    document.getElementById('inAction').onclick = () => startRoll('in');
    document.getElementById('outAction').onclick = () => startRoll('out');
</script>
</body>
</html>
