<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>回転体シミュレーター - 円柱と円錐</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 900px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
        
        h2 { grid-column: 1 / 3; color: #2c3e50; text-align: center; margin: 0 0 10px 0; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* ❶ コントロールパネル */
        .control-panel { background: #f8f9fa; padding: 18px; border-radius: 12px; border: 1px solid #e9ecef; }
        .shape-select { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 10px 18px; border-radius: 20px; border: 2px solid #3498db; background: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .mode-btn.active { background: #3498db; color: white; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        input[type="number"] { width: 60px; text-align: right; }

        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 0 #2c3e50; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2c3e50; }
        .btn-start { background: #e67e22; }
        .btn-reset { background: #95a5a6; }

        /* ❷ 視覚化エリア */
        .viz-area { position: relative; width: 500px; height: 500px; background: white; border-radius: 12px; border: 1px solid #dee2e6; margin: 0 auto; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; }
        #axisCanvas { z-index: 1; } /* 回転軸 */
        #solidCanvas { z-index: 2; } /* 立体の残像 */
        #shapeCanvas { z-index: 3; } /* 回転する平面図形 */

        .info-box { margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 10px; border: 1px solid #bbdefb; color: #0d47a1; font-size: 14px; }
        .info-title { font-weight: bold; margin-bottom: 5px; }
        
        .note { grid-column: 1 / 3; font-size: 11px; color: #7f8c8d; text-align: center; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>回転体シミュレーター（円柱と円錐）</h2>

    <div class="control-panel">
        <div class="shape-select">
            <button id="btnRect" class="mode-btn active" onclick="setShape('rect')">長方形 → 円柱</button>
            <button id="btnTri" class="mode-btn" onclick="setShape('tri')">直角三角形 → 円錐</button>
        </div>

        <div class="input-group">
            <label>底面の半径 (cm)</label>
            <div class="input-row">
                <input type="range" id="radius_r" min="1" max="10" step="0.5" value="5">
                <input type="number" id="radius_n" value="5" step="0.5">
            </div>
        </div>
        <div class="input-group">
            <label>高さ (cm)</label>
            <div class="input-row">
                <input type="range" id="height_r" min="1" max="20" step="1" value="10">
                <input type="number" id="height_n" value="10" step="1">
            </div>
        </div>
        <div class="input-group" style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px;">
            <label>視点の角度（斜め〜真横）</label>
            <div class="input-row">
                <input type="range" id="viewAngle_r" min="10" max="90" step="5" value="60">
                <span style="font-size:12px; color:#7f8c8d;">角度</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="startBtn" onclick="toggleSim()">回転させる！</button>
            <button class="btn btn-reset" onclick="resetSim()">リセット</button>
        </div>

        <div class="info-box">
            <div class="info-title" id="infoTitle">長方形を回転させると...</div>
            <div id="infoText">底面の半径が5cm、高さが10cmの「円柱」ができます。</div>
        </div>
    </div>

    <div class="viz-area">
        <canvas id="axisCanvas" width="500" height="500"></canvas>
        <canvas id="solidCanvas" width="500" height="500"></canvas>
        <canvas id="shapeCanvas" width="500" height="500"></canvas>
    </div>

    <p class="note">※平面図形（長方形・三角形）が回転した跡（残像）が重なって、立体に見える様子をシミュレーションしています。</p>
</div>

<script>
    let shape = 'rect';
    let running = false;
    let angle = 0; // 回転角 (度)
    let animationId;
    const centerX = 250;
    const centerY = 350; // 底面の中心
    const scale = 15; // 1cmあたりのピクセル数

    function setShape(s) {
        shape = s;
        document.getElementById('btnRect').classList.toggle('active', shape === 'rect');
        document.getElementById('btnTri').classList.toggle('active', shape === 'tri');
        resetSim();
    }

    function sync(id) {
        const r = document.getElementById(id + '_r');
        const n = document.getElementById(id + '_n');
        r.addEventListener('input', () => { n.value = r.value; resetSim(); });
        n.addEventListener('input', () => { r.value = n.value; resetSim(); });
    }

    function getParams() {
        return {
            r: parseFloat(document.getElementById('radius_n').value),
            h: parseFloat(document.getElementById('height_n').value),
            v: parseFloat(document.getElementById('viewAngle_r').value) * Math.PI / 180 // 視角(ラジアン)
        };
    }

    function updateInfo() {
        const p = getParams();
        const title = document.getElementById('infoTitle');
        const text = document.getElementById('infoText');
        if (shape === 'rect') {
            title.innerText = "長方形を回転させると...";
            text.innerText = `底面の半径が${p.r}cm、高さが${p.h}cmの「円柱」ができます。`;
        } else {
            title.innerText = "直角三角形を回転させると...";
            text.innerText = `底面の半径が${p.r}cm、高さが${p.h}cmの「円錐」ができます。`;
        }
    }

    // 軸と底面の楕円を描画
    function drawAxis() {
        const p = getParams();
        const ctx = document.getElementById('axisCanvas').getContext('2d');
        ctx.clearRect(0, 0, 500, 500);

        // 回転軸（破線）
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.moveTo(centerX, centerY + 20);
        ctx.lineTo(centerX, centerY - p.h * scale - 20);
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]); // 元に戻す

        // 底面の楕円（うっすら）
        ctx.beginPath();
        ctx.ellipse(centerX, centerY, p.r * scale, p.r * scale * Math.cos(p.v), 0, 0, 2 * Math.PI);
        ctx.strokeStyle = '#add8e6';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    // 平面図形と立体の残像を描画
    function draw(currentAngle) {
        const p = getParams();
        const ctxS = document.getElementById('shapeCanvas').getContext('2d'); // 動く図形
        const ctxSolid = document.getElementById('solidCanvas').getContext('2d'); // 残像
        
        ctxS.clearRect(0, 0, 500, 500);
        
        const rad = currentAngle * Math.PI / 180;
        const cosAngle = Math.cos(rad);
        const sinAngle = Math.sin(rad);

        // 回転後の座標計算（簡易的な3D投影）
        const rotR = p.r * cosAngle * scale;
        const depR = p.r * sinAngle * scale; // 奥行き
        
        // 投影後のY座標調整（視角による潰れ）
        const yOffset = depR * Math.cos(p.v);

        // ❸ 立体の残像を描画（線を描き足していく）
        ctxSolid.lineWidth = 1;
        ctxSolid.strokeStyle = 'rgba(52, 152, 219, 0.1)'; // 薄い青で重なりを表現
        
        if (shape === 'rect') {
            // 円柱の側面（縦線）
            ctxSolid.beginPath();
            ctxSolid.moveTo(centerX + rotR, centerY + yOffset);
            ctxSolid.lineTo(centerX + rotR, centerY - p.h * scale + yOffset);
            ctxSolid.stroke();
            
            // 底面と上面の点（楕円の軌跡）
            ctxSolid.fillStyle = 'rgba(52, 152, 219, 0.05)';
            ctxSolid.fillRect(centerX + rotR, centerY + yOffset, 1, 1);
            ctxSolid.fillRect(centerX + rotR, centerY - p.h * scale + yOffset, 1, 1);
        } else {
            // 円錐の母線
            ctxSolid.beginPath();
            ctxSolid.moveTo(centerX, centerY - p.h * scale); // 頂点
            ctxSolid.lineTo(centerX + rotR, centerY + yOffset); // 底面の点
            ctxSolid.stroke();

            // 底面の点
            ctxSolid.fillStyle = 'rgba(230, 126, 34, 0.05)'; // 円錐はオレンジ系
            ctxSolid.fillRect(centerX + rotR, centerY + yOffset, 1, 1);
        }

        // ❹ 回転する平面図形を描画
        ctxS.lineWidth = 3;
        if (shape === 'rect') {
            ctxS.strokeStyle = '#3498db';
            ctxS.fillStyle = 'rgba(52, 152, 219, 0.3)';
            ctxS.beginPath();
            ctxS.moveTo(centerX, centerY);
            ctxS.lineTo(centerX + rotR, centerY + yOffset);
            ctxS.lineTo(centerX + rotR, centerY - p.h * scale + yOffset);
            ctxS.lineTo(centerX, centerY - p.h * scale);
            ctxS.closePath();
        } else {
            ctxS.strokeStyle = '#e67e22';
            ctxS.fillStyle = 'rgba(230, 126, 34, 0.3)';
            ctxS.beginPath();
            ctxS.moveTo(centerX, centerY);
            ctxS.lineTo(centerX + rotR, centerY + yOffset);
            ctxS.lineTo(centerX, centerY - p.h * scale); // 頂点
            ctxS.closePath();
        }
        ctxS.fill();
        ctxS.stroke();
    }

    function toggleSim() {
        if (angle >= 360) resetSim();
        running = !running;
        document.getElementById('startBtn').innerText = running ? '一時停止' : '回転させる！';
        if (running) animate();
    }

    function animate() {
        if (!running) return;
        angle += 2; // 回転速度
        draw(angle);
        if (angle >= 360) {
            running = false;
            document.getElementById('startBtn').innerText = '回転させる！';
        } else {
            animationId = requestAnimationFrame(animate);
        }
    }

    function resetSim() {
        running = false;
        angle = 0;
        cancelAnimationFrame(animationId);
        document.getElementById('solidCanvas').getContext('2d').clearRect(0, 0, 500, 500);
        document.getElementById('startBtn').innerText = '回転させる！';
        drawAxis();
        draw(0);
        updateInfo();
    }

    ['radius', 'height', 'viewAngle'].forEach(sync);
    document.getElementById('viewAngle_r').addEventListener('input', resetSim); // 視点変更はリセット
    resetSim();
</script>
</body>
</html>
