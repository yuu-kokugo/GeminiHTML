<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>立方体の切断シミュレーター</title>
    <style>
        body { margin: 0; display: flex; font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a1a; color: #fff; height: 100vh; overflow: hidden; }
        #sidebar { width: 300px; background: #2a2a2a; padding: 25px; box-shadow: 2px 0 15px rgba(0,0,0,0.5); z-index: 10; display: flex; flex-direction: column; }
        canvas { flex-grow: 1; cursor: crosshair; background: #111; }
        h3 { border-left: 5px solid #ff4444; padding-left: 10px; font-size: 20px; margin: 0 0 25px 0; color: #eee; }
        #result-area { flex-grow: 1; margin-top: 20px; text-align: center; background: #333; border-radius: 10px; padding: 20px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); }
        #point-count { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        #shape-name { font-size: 28px; font-weight: bold; color: #ffeb3b; min-height: 40px; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        #shape-detail { font-size: 16px; color: #ffeb3b; opacity: 0.9; min-height: 20px; }
        #btn-reset { width: 100%; padding: 15px; cursor: pointer; border: none; border-radius: 8px; background: #555; color: white; font-weight: bold; transition: 0.2s; font-size: 16px; margin-top: 20px; }
        #btn-reset:hover { background: #666; }
        .instructions { font-size: 12px; color: #bbb; line-height: 1.7; margin-top: auto; border-top: 1px solid #444; padding-top: 25px; }
        .point-hint { color: #448aff; font-weight: bold; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>立方体の切断</h3>
    
    <div id="result-area">
        <div id="point-count">選択された点: 0 / 3</div>
        <div id="shape-name"></div>
        <div id="shape-detail"></div>
    </div>

    <button id="btn-reset" onclick="totalReset()">全リセット</button>
    
    <div class="instructions">
        【操作方法】<br>
        ・辺の上の点（6等分点）や頂点を3つクリックして選択してください。<br>
        ・画面をドラッグすると自由に回転します。<br>
        ・<span class="point-hint">青い点</span>は辺の中点です。<br>
        ※3点を選択すると、切り口の形状を自動判定します。
    </div>
</div>

<canvas id="cubeCanvas"></canvas>

<script>
const canvas = document.getElementById('cubeCanvas');
const ctx = canvas.getContext('2d');
let width, height;

// 初期角度
const DEFAULT_ANGLE_X = -0.5;
const DEFAULT_ANGLE_Y = 0.6;
let angleX = DEFAULT_ANGLE_X;
let angleY = DEFAULT_ANGLE_Y;
let scale = 240; // 少し大きく
let selectedPoints = [];

const vertices = [
    {x:-1, y:-1, z:-1}, {x: 1, y:-1, z:-1}, {x: 1, y: 1, z:-1}, {x:-1, y: 1, z:-1},
    {x:-1, y:-1, z: 1}, {x: 1, y:-1, z: 1}, {x: 1, y: 1, z: 1}, {x:-1, y: 1, z: 1}
];
const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
const selectablePoints = [];

function initPoints() {
    selectablePoints.length = 0;
    // 頂点
    vertices.forEach((v, i) => selectablePoints.push({...v, type:'v', id:`v${i}`}));
    // 各辺を6等分する点 (1/6, 2/6, 3/6, 4/6, 5/6)
    edges.forEach((edge, i) => {
        const v1 = vertices[edge[0]], v2 = vertices[edge[1]];
        for(let j=1; j<6; j++) {
            selectablePoints.push({
                x: v1.x + (v2.x - v1.x) * (j/6),
                y: v1.y + (v2.y - v1.y) * (j/6),
                z: v1.z + (v2.z - v1.z) * (j/6),
                type: (j===3 ? 'mid' : 'div'), // 中点かそれ以外か
                id: `e${i}_${j}`
            });
        }
    });
}
initPoints();

function project(p) {
    let y1 = p.y * Math.cos(angleX) - p.z * Math.sin(angleX);
    let z1 = p.y * Math.sin(angleX) + p.z * Math.cos(angleX);
    let x2 = p.x * Math.cos(angleY) + z1 * Math.sin(angleY);
    let z2 = -p.x * Math.sin(angleY) + z1 * Math.cos(angleY);
    return { x: width / 2 + x2 * scale, y: height / 2 + y1 * scale, z: z2 };
}

function draw() {
    ctx.clearRect(0, 0, width, height);
    
    // 補助線の描画
    ctx.strokeStyle = '#444';
    ctx.setLineDash([5, 5]);
    edges.forEach(e => {
        const p1 = project(vertices[e[0]]), p2 = project(vertices[e[1]]);
        ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    });
    ctx.setLineDash([]);

    // 切断面の計算と描画
    if (selectedPoints.length === 3) calculateSlice();

    // 選択可能なドットの描画
    selectablePoints.forEach(p => {
        const proj = project(p);
        const isSelected = selectedPoints.find(sp => sp.id === p.id);
        
        if (isSelected) {
            ctx.fillStyle = '#ff4444';
            ctx.beginPath(); ctx.arc(proj.x, proj.y, 8, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.fillStyle = (p.type === 'mid' ? '#448aff' : (p.type === 'v' ? '#888' : '#333'));
            ctx.beginPath(); ctx.arc(proj.x, proj.y, (p.type==='div'?2.5:5), 0, Math.PI*2); ctx.fill();
        }
    });
}

// ベクトルの基本操作
const vec = {
    sub: (a, b) => ({x: a.x - b.x, y: a.y - b.y, z: a.z - b.z}),
    cross: (a, b) => ({x: a.y*b.z - a.z*b.y, y: a.z*b.x - a.x*b.z, z: a.x*b.y - a.y*b.x}),
    dot: (a, b) => a.x*b.x + a.y*b.y + a.z*b.z,
    lenSq: (a) => a.x*a.x + a.y*a.y + a.z*a.z,
    len: (a) => Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z),
    normalize: (a) => { const l = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z); return {x: a.x/l, y: a.y/l, z: a.z/l}; },
    isParallel: (a, b) => vec.lenSq(vec.cross(vec.normalize(a), vec.normalize(b))) < 0.001
};

function calculateSlice() {
    const p = selectedPoints;
    const v1 = vec.sub(p[1], p[0]);
    const v2 = vec.sub(p[2], p[0]);
    const n = vec.cross(v1, v2);
    const d = -vec.dot(n, p[0]);

    const intersects = [];
    edges.forEach(edge => {
        const A = vertices[edge[0]], B = vertices[edge[1]];
        const den = vec.dot(n, vec.sub(B, A));
        if(Math.abs(den) > 0.0001) {
            const t = -(vec.dot(n, A) + d) / den;
            if(t >= -0.0001 && t <= 1.0001) {
                const pt = { x: A.x+t*(B.x-A.x), y: A.y+t*(B.y-A.y), z: A.z+t*(B.z-A.z) };
                if(!intersects.find(i => Math.hypot(i.x-pt.x, i.y-pt.y, i.z-pt.z) < 0.001)) intersects.push(pt);
            }
        }
    });

    if(intersects.length >= 3) {
        const center = intersects.reduce((a,b)=>({x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}), {x:0,y:0,z:0});
        center.x /= intersects.length; center.y /= intersects.length; center.z /= intersects.length;
        intersects.sort((a,b) => {
            const pa = project(a), pb = project(b), pc = project(center);
            return Math.atan2(pa.y-pc.y, pa.x-pc.x) - Math.atan2(pb.y-pc.y, pb.x-pc.x);
        });

        // 描画
        ctx.fillStyle = 'rgba(211, 47, 47, 0.5)'; // 濃い赤に変更
        ctx.strokeStyle = '#ff4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        const start = project(intersects[0]);
        ctx.moveTo(start.x, start.y);
        intersects.forEach(inter => { const pr = project(inter); ctx.lineTo(pr.x, pr.y); });
        ctx.closePath(); ctx.fill(); ctx.stroke();
        
        identifyShape(intersects);
    }
}

function identifyShape(pts) {
    const count = pts.length;
    let name = "";
    let detail = "";

    if (count === 3) {
        name = "三角形";
        const sidesSq = [
            vec.lenSq(vec.sub(pts[1], pts[0])),
            vec.lenSq(vec.sub(pts[2], pts[1])),
            vec.lenSq(vec.sub(pts[0], pts[2]))
        ];
        if (sidesSq.every(s => Math.abs(s - sidesSq[0]) < 0.001)) {
            detail = "（正三角形）";
        } else if (sidesSq[0]===sidesSq[1] || sidesSq[1]===sidesSq[2] || sidesSq[2]===sidesSq[0]) {
            detail = "（二等辺三角形）";
        }
    } else if (count === 4) {
        name = "四角形";
        const sides = [
            vec.sub(pts[1], pts[0]),
            vec.sub(pts[2], pts[1]),
            vec.sub(pts[3], pts[2]),
            vec.sub(pts[0], pts[3])
        ];
        const sidesLenSq = sides.map(s => vec.lenSq(s));
        const p1 = vec.isParallel(sides[0], sides[2]); // 向かい合う辺が平行
        const p2 = vec.isParallel(sides[1], sides[3]);
        const ang0 = vec.dot(vec.normalize(sides[0]), vec.normalize(vec.sub(pts[3], pts[0]))); // 隣り合う辺の角度(のcos)
        const isRight = Math.abs(ang0) < 0.01;

        if (p1 && p2) { // 平行四辺形
            const allSidesEqual = sidesLenSq.every(s => Math.abs(s - sidesLenSq[0]) < 0.001);
            if (isRight) {
                detail = allSidesEqual ? "（正方形）" : "（長方形）";
            } else {
                detail = allSidesEqual ? "（ひし形）" : "（平行四辺形）";
            }
        } else if (p1 || p2) { // 台形
            const isIsosceles = Math.abs(sidesLenSq[1] - sidesLenSq[3]) < 0.001 || Math.abs(sidesLenSq[0] - sidesLenSq[2]) < 0.001;
            detail = isIsosceles ? "（等脚台形）" : "（台形）";
        }
    } else if (count === 5) {
        name = "五角形";
    } else if (count === 6) {
        name = "六角形";
        const sidesSq = [
            vec.lenSq(vec.sub(pts[1], pts[0])), vec.lenSq(vec.sub(pts[2], pts[1])),
            vec.lenSq(vec.sub(pts[3], pts[2])), vec.lenSq(vec.sub(pts[4], pts[3])),
            vec.lenSq(vec.sub(pts[5], pts[4])), vec.lenSq(vec.sub(pts[0], pts[5]))
        ];
        if (sidesSq.every(s => Math.abs(s - sidesSq[0]) < 0.001)) {
            // 受験算数では、6等分点を選ぶ限り、すべての辺が等しければ正六角形となる
            detail = "（正六角形）"; 
        }
    }

    document.getElementById('shape-name').innerText = name;
    document.getElementById('shape-detail').innerText = detail;
}

function totalReset() {
    selectedPoints = [];
    angleX = DEFAULT_ANGLE_X;
    angleY = DEFAULT_ANGLE_Y;
    document.getElementById('shape-name').innerText = "";
    document.getElementById('shape-detail').innerText = "";
    document.getElementById('point-count').innerText = "選択された点: 0 / 3";
    draw();
}

// インタラクション
window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth - 300; // サイドバーを広く
    height = canvas.height = window.innerHeight;
    draw();
});

let isDragging = false, lastX, lastY;
canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
    if(!isDragging) return;
    angleY += (e.clientX - lastX) * 0.01; angleX += (e.clientY - lastY) * 0.01;
    lastX = e.clientX; lastY = e.clientY; draw();
});

canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    let clicked = selectablePoints.find(p => {
        const proj = project(p);
        return Math.hypot(proj.x - mx, proj.y - my) < 14; // 当たり判定をさらに広く
    });
    
    if(clicked) {
        const idx = selectedPoints.findIndex(sp => sp.id === clicked.id);
        if(idx > -1) {
            selectedPoints.splice(idx, 1);
        } else if(selectedPoints.length < 3) {
            selectedPoints.push(clicked);
        }
        document.getElementById('point-count').innerText = `選択された点: ${selectedPoints.length} / 3`;
        draw();
    }
});

window.dispatchEvent(new Event('resize'));
</script>
</body>
</html>
