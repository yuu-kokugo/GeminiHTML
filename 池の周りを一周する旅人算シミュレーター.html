<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>旅人算シミュレーター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 950px; display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .main-col { grid-column: 1 / 2; }
        .side-col { grid-column: 2 / 3; background: #f8f9fa; border-radius: 12px; padding: 15px; border: 1px solid #e9ecef; }
        
        h2 { grid-column: 1 / 3; color: #2c3e50; text-align: center; margin: 0 0 10px 0; }
        
        .control-panel { background: #f8f9fa; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .input-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .input-row label { width: 120px; font-size: 13px; font-weight: bold; }
        input[type="range"] { flex: 1; }
        input[type="number"] { width: 60px; }

        .direction-toggle { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .mode-btn { padding: 8px 16px; border-radius: 20px; border: 2px solid #3498db; background: white; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #3498db; color: white; }

        .viz-area { position: relative; width: 400px; height: 400px; margin: 0 auto; background: white; border-radius: 50%; }
        #pond { width: 300px; height: 300px; border: 12px solid #add8e6; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #e0f7fa; z-index: 1; }
        
        .runner { width: 20px; height: 20px; border-radius: 50%; position: absolute; transform: translate(-50%, -50%); font-size: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; border: 2px solid white; z-index: 10; }
        #runnerA { background: #e74c3c; }
        #runnerB { background: #3498db; }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        #markerCanvas { z-index: 3; }

        .history-list { font-size: 13px; line-height: 1.6; }
        .history-item { padding: 4px 0; border-bottom: 1px solid #dee2e6; }
        .history-item span { font-weight: bold; color: #c0392b; }

        .calc-area { margin-top: 15px; padding: 12px; background: #fffde7; border-radius: 10px; border: 2px dashed #f1c40f; text-align: center; }
        .formula { font-size: 18px; font-weight: bold; color: #c0392b; }

        .btn-group { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: white; }
        .btn-start { background: #27ae60; width: 120px; }
        .btn-reset { background: #95a5a6; }
    </style>
</head>
<body>

<div class="container">
    <h2>旅人算シミュレーター</h2>

    <div class="main-col">
        <div class="direction-toggle">
            <button id="btnOpposite" class="mode-btn active" onclick="setMode('opposite')">反対方向に進む（出会い）</button>
            <button id="btnSame" class="mode-btn" onclick="setMode('same')">同じ方向に進む（追い越し）</button>
        </div>

        <div class="control-panel">
            <div class="input-row">
                <label>池の一周 (m)</label>
                <input type="range" id="pondLen_r" min="100" max="1000" step="50" value="400">
                <input type="number" id="pondLen_n" value="400">
            </div>
            <div class="input-row">
                <label>A君 (赤) m/分</label>
                <input type="range" id="speedA_r" min="10" max="200" step="5" value="70">
                <input type="number" id="speedA_n" value="70">
            </div>
            <div class="input-row">
                <label>B君 (青) m/分</label>
                <input type="range" id="speedB_r" min="10" max="200" step="5" value="30">
                <input type="number" id="speedB_n" value="30">
            </div>
        </div>

        <div class="viz-area">
            <canvas id="trailCanvas" width="400" height="400"></canvas>
            <canvas id="markerCanvas" width="400" height="400"></canvas>
            <div id="pond"></div>
            <div id="runnerA" class="runner">A</div>
            <div id="runnerB" class="runner">B</div>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="startBtn" onclick="toggleSim()">スタート</button>
            <button class="btn btn-reset" onclick="resetSim()">リセット</button>
        </div>
    </div>

    <div class="side-col">
        <h3 style="font-size: 16px; margin-top: 0;">出会い・追い越しの記録</h3>
        <div id="historyList" class="history-list">
            まだ記録はありません
        </div>
        <div class="calc-area">
            <div style="font-size: 12px;">【計算式】</div>
            <div class="formula" id="formulaText">---</div>
            <div id="timerText" style="font-size: 14px; margin-top:5px;">時間: 0.00 分</div>
        </div>
    </div>
</div>

<script>
    let mode = 'opposite';
    let running = false;
    let time = 0;
    let lastEventCount = 0;
    let animationId;
    const pondRadius = 150;
    const centerX = 200;
    const centerY = 200;

    function setMode(m) {
        mode = m;
        document.getElementById('btnOpposite').classList.toggle('active', mode === 'opposite');
        document.getElementById('btnSame').classList.toggle('active', mode === 'same');
        resetSim();
    }

    function sync(id) {
        const r = document.getElementById(id + '_r');
        const n = document.getElementById(id + '_n');
        r.addEventListener('input', () => { n.value = r.value; resetSim(); });
        n.addEventListener('input', () => { r.value = n.value; resetSim(); });
    }

    function getParams() {
        return {
            len: parseFloat(document.getElementById('pondLen_n').value),
            sA: parseFloat(document.getElementById('speedA_n').value),
            sB: parseFloat(document.getElementById('speedB_n').value)
        };
    }

    function updateFormula() {
        const p = getParams();
        const formulaText = document.getElementById('formulaText');
        if (mode === 'opposite') {
            const t = p.len / (p.sA + p.sB);
            formulaText.innerText = `${p.len} ÷ (${p.sA} + ${p.sB}) = ${t.toFixed(2)} 分ごと`;
        } else {
            const diff = Math.abs(p.sA - p.sB);
            if (diff === 0) formulaText.innerText = "追いつきません";
            else {
                const t = p.len / diff;
                formulaText.innerText = `${p.len} ÷ (${Math.max(p.sA, p.sB)} - ${Math.min(p.sA, p.sB)}) = ${t.toFixed(2)} 分ごと`;
            }
        }
    }

    function draw() {
        const p = getParams();
        const tCanvas = document.getElementById('trailCanvas');
        const mCanvas = document.getElementById('markerCanvas');
        const ctxT = tCanvas.getContext('2d');
        const ctxM = mCanvas.getContext('2d');
        
        // 軌跡の描画（Aは赤、Bは青）
        const distA = p.sA * time;
        const angleA = (distA / p.len) * 2 * Math.PI - Math.PI/2;
        const ax = centerX + pondRadius * Math.cos(angleA);
        const ay = centerY + pondRadius * Math.sin(angleA);
        
        const distB = p.sB * time;
        const dirB = (mode === 'opposite') ? -1 : 1;
        const angleB = (distB / p.len) * 2 * Math.PI * dirB - Math.PI/2;
        const bx = centerX + pondRadius * Math.cos(angleB);
        const by = centerY + pondRadius * Math.sin(angleB);

        // Aの軌跡
        ctxT.beginPath();
        ctxT.strokeStyle = 'rgba(231, 76, 60, 0.5)';
        ctxT.lineWidth = 4;
        const prevAngleA = (p.sA * (time - 0.01) / p.len) * 2 * Math.PI - Math.PI/2;
        ctxT.arc(centerX, centerY, pondRadius, prevAngleA, angleA);
        ctxT.stroke();

        // Bの軌跡
        ctxT.beginPath();
        ctxT.strokeStyle = 'rgba(52, 152, 219, 0.5)';
        ctxT.lineWidth = 4;
        const prevAngleB = (p.sB * (time - 0.01) / p.len) * 2 * Math.PI * dirB - Math.PI/2;
        ctxT.arc(centerX, centerY, pondRadius, prevAngleB, angleB, (mode === 'opposite'));
        ctxT.stroke();

        // 出会い・追い越し判定
        let eventInterval = (mode === 'opposite') ? (p.len / (p.sA + p.sB)) : (p.len / Math.abs(p.sA - p.sB));
        let currentEventCount = Math.floor(time / eventInterval + 0.001);

        if (currentEventCount > lastEventCount && isFinite(eventInterval)) {
            lastEventCount = currentEventCount;
            // マーカー設置
            ctxM.beginPath();
            ctxM.fillStyle = "#2c3e50";
            ctxM.arc(ax, ay, 6, 0, Math.PI * 2);
            ctxM.fill();
            ctxM.strokeStyle = "white";
            ctxM.stroke();
            
            ctxM.font = "bold 12px Arial";
            ctxM.fillText(`${currentEventCount}回目`, ax + 10, ay);

            // ログ追加
            const list = document.getElementById('historyList');
            if(currentEventCount === 1) list.innerHTML = "";
            const div = document.createElement('div');
            div.className = "history-item";
            div.innerHTML = `${currentEventCount}回目: <span>${(eventInterval * currentEventCount).toFixed(2)}分</span> 地点`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        document.getElementById('runnerA').style.left = ax + 'px';
        document.getElementById('runnerA').style.top = ay + 'px';
        document.getElementById('runnerB').style.left = bx + 'px';
        document.getElementById('runnerB').style.top = by + 'px';
        document.getElementById('timerText').innerText = `時間: ${time.toFixed(2)} 分`;
    }

    function toggleSim() {
        running = !running;
        document.getElementById('startBtn').innerText = running ? '停止' : '再開';
        if (running) animate();
    }

    function animate() {
        if (!running) return;
        time += 0.01;
        draw();
        animationId = requestAnimationFrame(animate);
    }

    function resetSim() {
        running = false;
        time = 0;
        lastEventCount = 0;
        cancelAnimationFrame(animationId);
        const tCanvas = document.getElementById('trailCanvas');
        const mCanvas = document.getElementById('markerCanvas');
        tCanvas.getContext('2d').clearRect(0, 0, 400, 400);
        mCanvas.getContext('2d').clearRect(0, 0, 400, 400);
        document.getElementById('historyList').innerHTML = "まだ記録はありません";
        document.getElementById('startBtn').innerText = 'スタート';
        updateFormula();
        draw();
    }

    ['pondLen', 'speedA', 'speedB'].forEach(sync);
    updateFormula();
    draw();
</script>
</body>
</html>
